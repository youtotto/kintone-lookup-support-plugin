<div class="ls-config">
  <h1 class="kintoneplugin-title">ルックアップサポート</h1>
  <p class="ls-lead">レコード詳細画面でルックアップフィールドとコピー先フィールドを同じ色で表示し、追加・編集画面でルックアップを自動取得します。ルックアップごとに設定してください。</p>
  <div id="ls-notices"></div>
  <div id="ls-cards"></div>
  <div id="ls-subtable-notice"></div>
  <div class="kintoneplugin-button-area">
    <button type="button" id="ls-save" class="kintoneplugin-button-dialog-ok">保存</button>
    <button type="button" id="ls-cancel" class="kintoneplugin-button-dialog-cancel">キャンセル</button>
  </div>
  <div id="ls-upsell"></div>
  <style>
    .ls-config { font-size: 14px; color: #333; }
    .ls-config .kintoneplugin-title { margin-bottom: 8px; }
    .ls-lead { margin: 0 0 16px; color: #555; }
    .ls-notice { padding: 10px 12px; margin: 0 0 12px; border-radius: 4px; border: 1px solid #ccc; background: #f7f7f7; }
    .ls-notice-info { border-color: #9ec5e8; background: #eef6fc; }
    .ls-notice-error { border-color: #e0a0a0; background: #fdeeee; }
    .ls-card { border: 1px solid #ddd; border-radius: 6px; padding: 14px 16px; margin: 0 0 14px; background: #fff; }
    .ls-card-orphan { border-style: dashed; background: #fafafa; }
    .ls-card-title { font-size: 16px; font-weight: bold; margin: 0 0 4px; }
    .ls-card-copy { color: #666; margin: 0 0 10px; }
    .ls-section { border-top: 1px solid #eee; padding: 10px 0 4px; }
    .ls-section-title { font-size: 14px; margin: 0 0 4px; }
    .ls-section-note { margin: 0 0 8px; color: #666; font-size: 12px; }
    .ls-check { display: inline-block; margin: 0 16px 6px 0; }
    .ls-row { display: flex; align-items: center; gap: 10px; margin: 4px 0 8px; }
    .ls-row-label { min-width: 7em; color: #555; }
    .ls-config .kintoneplugin-select { min-width: 220px; }
    .ls-warning { color: #a33; background: #fff4f4; border: 1px solid #f0c0c0; border-radius: 4px; padding: 6px 10px; margin: 4px 0 0; }
    .ls-orphan-note { color: #a33; margin: 0 0 8px; }
    .ls-empty { color: #666; }
    .ls-subtable-notice { color: #555; margin: 4px 0 8px; }
    .ls-upsell { color: #777; font-size: 12px; margin: 24px 0 8px; }
    .ls-upsell a { color: #3d7fcf; }
  </style>
</div>
